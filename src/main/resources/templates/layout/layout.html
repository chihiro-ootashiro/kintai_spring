<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- 1. ヘッド共通化 -->

<head th:fragment="head">
	<meta charset="UTF-8">
	<!-- jQuery -->
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"
		integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

	<!-- Bootstrap CSS -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<!-- Bootstrap JS -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
		integrity="FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

	<!-- 呼び出し元から渡されたタイトルが入る -->
	<title th:text="${title}"></title>
</head>

<body>
	<!-- 2. ヘッダー共通化-->
	<header th:fragment="header">
		<div>
			<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
				<div class="container-fluid">
					<a class="navbar-brand" href="" th:text="#{title}"></a>
					<!-- メニューアイコン -->
					<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
						aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
						<span class="navbar-toggler-icon"></span>
					</button>

					<!-- メニューコンテナ -->
					<div class="collapse navbar-collapse" id="navbarNav">

						<th:block sec:authorize="hasRole('ADMIN')">
							<!-- 勤怠管理画面 -->
							<ul class="navbar-nav">
								<li class="nav-item">
									<a class="nav-link" th:classappend="${page == 'index'} ? 'active'"
										aria-current="page" th:href="@{/attendance/list}"
										th:text="#{title.kintaikanri}"></a>
								</li>
							</ul>
						</th:block>

						<!-- 勤怠入力 -->
						<ul class="navbar-nav">
							<li class="nav-item">
								<a class="nav-link" th:classappend="${page == 'index'} ? 'active'" aria-current="page"
									th:href="@{/employee/input}" th:text="#{title.kintainyuuryoku}"></a>
							</li>
						</ul>

						<!-- マスタ管理-->
						<th:block sec:authorize="hasRole('ADMIN')">
							<ul class="navbar-nav">
								<li class="nav-item dropdown">
									<a class="nav-link dropdown-toggle" href="#" id="masterDropdown" role="button"
										data-bs-toggle="dropdown" aria-expanded="false" th:text="#{title.master}">
									</a>
									<ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end"
										aria-labelledby="masterDropdown">
										<li><a class="dropdown-item" th:href="@{/employee/index}">社員マスタ管理</a></li>
										<!-- 祝日マスタ画面作ったら @{/holiday/index}設定 -->
										<li><a class="dropdown-item" href="#">祝日マスタ管理</a></li>
									</ul>
								</li>
							</ul>
						</th:block>
						<!-- ログアウト -->
						<ul class="navbar-nav">
							<li class="nav-item">
								<form th:action="@{/logout}" method="post">
									<button type="submit" class="nav-link">ログアウト
									</button>
								</form>
							</li>
						</ul>

					</div>
				</div>
			</nav>
		</div>
	</header>

	<!-- 4. FOOTER共通化 -->
	<footer th:fragment="footer">
		<div></div>
	</footer>
</body>

</html>
