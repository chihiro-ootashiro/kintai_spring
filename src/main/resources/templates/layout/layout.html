<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- 1. ヘッド共通化 -->

<head th:fragment="head">
	<meta charset="UTF-8">
	<!-- jQuery -->
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"
		integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

	<!-- Bootstrap CSS -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<!-- Bootstrap JS -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
		integrity="FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

	<!-- 呼び出し元から渡されたタイトルが入る -->
	<title th:text="${title}"></title>
</head>

<body>
	<!-- 2. ヘッダー共通化-->
	<header th:fragment="header">
		<div>
			<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
				<div class="container-fluid">
					<a class="navbar-brand" href="" th:text="#{title}"></a>
					<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
						aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
						<span class="navbar-toggler-icon"></span>
					</button>

					<div class="collapse navbar-collapse" id="navbarNav">
						<th:block sec:authorize="hasRole('ADMIN')">
							<!-- 勤怠管理画面 -->
							<ul class="navbar-nav">
								<li class="nav-item">
									<a class="nav-link nav-menu-link" data-path="/attendance" aria-current="page"
										th:href="@{/attendance/list}" th:text="#{title.kintaikanri}"></a>
								</li>
							</ul>
						</th:block>

						<!-- 勤怠入力 -->
						<ul class="navbar-nav">
							<li class="nav-item">
								<a class="nav-link nav-menu-link" data-path="/employee/input" aria-current="page"
									th:href="@{/employee/input}" th:text="#{title.kintainyuuryoku}"></a>
							</li>
						</ul>

						<!-- マスタ管理 -->
						<th:block sec:authorize="hasRole('ADMIN')">
							<ul class="navbar-nav">
								<li class="nav-item dropdown">
									<!-- ドロップダウン -->
									<a class="nav-link dropdown-toggle nav-menu-link" href="#" id="masterDropdown"
										role="button" data-bs-toggle="dropdown" aria-expanded="false"
										th:text="#{title.master}" data-path="/employee/index,/holiday">
									</a>
									<ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end"
										aria-labelledby="masterDropdown">
										<li><a class="dropdown-item nav-menu-link" th:href="@{/employee/index}"
												data-path="/employee/index">社員マスタ管理</a></li>
										<li><a class="dropdown-item nav-menu-link" th:href="@{/holiday/list}"
												data-path="/holiday">祝日マスタ管理</a></li>
									</ul>
								</li>
							</ul>
						</th:block>

						<!-- ログアウト -->
						<ul class="navbar-nav">
							<li class="nav-item">
								<form th:action="@{/logout}" method="post">
									<button type="submit" class="nav-link">ログアウト</button>
								</form>
							</li>
						</ul>
					</div>
				</div>
			</nav>
		</div>

		<!-- 自動でアクティブを切り替える -->
		<script>
			document.addEventListener("DOMContentLoaded", function () {
				// 現在のURLのパスを取得
				const currentPath = window.location.pathname;

				// すべてのメニューリンクをループ処理
				document.querySelectorAll(".nav-menu-link").forEach(link => {
					const paths = link.getAttribute("data-path").split(",");

					// 現在のURLが、設定したパスのいずれかで始まっていたら active を付与
					const isMatch = paths.some(path => currentPath.startsWith(path));
					if (isMatch) {
						link.classList.add("active");
					}
				});
			});
		</script>
	</header>


	<!-- 4. FOOTER共通化 -->
	<footer th:fragment="footer">
		<div></div>
	</footer>
</body>

</html>
