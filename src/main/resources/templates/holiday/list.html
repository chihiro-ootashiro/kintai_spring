<!DOCTYPE html>
<html xmlns="http://www.thymeleaf.org">
<!-- 共通化されたHEAD呼び出し -->

<head th:replace="~{layout/layout::head(title=勤怠管理システム)}">
</head>

<body>
	<input type="hidden" id="errorType" th:value="${errorType}" />
	<input type="hidden" id="successType" th:value="${successType}" />
	<!-- 共通化されたHEADER呼び出し -->
	<div th:replace="~{layout/layout::header}"></div>

	<div class="container mt-4">
		<h2>祝日マスタ管理</h2>

		<!-- 検索結果がなかった場合のメッセージ表示 -->
		<div th:if="${#lists.isEmpty(holidayList)}" class="alert alert-warning mb-2 mt-2">
			検索結果がありませんでした。
		</div>

		<!-- 検索条件カード -->
		<div class="card">
			<div class="card-header">検索条件</div>

			<form th:action="@{/holiday/list}" th:object="${holidaySearchForm}" method="get">
				<input type="hidden" th:field="*{page}" id="pageField" />

				<div class="row g-4 align-items-center ms-3 mt-1">
					<!-- 日付入力 -->
					<div class="col-md-3">
						<label class="form-label">日付：</label>
						<input type="date" th:field="*{date}" class="form-control" />
					</div>
					<!-- 祝日名入力 -->
					<div class="col-md-4">
						<label class="form-label">祝日名：</label>
						<input type="text" th:field="*{holidayName}" class="form-control" />
					</div>
				</div>

				<!-- ボタンエリア（右寄せ） -->
				<div class="d-flex justify-content-end mt-2 mb-3">
					<a th:href="@{/holiday/clear}" class="btn btn-warning btn-sm me-2">クリア</a>
					<button type="submit" class="btn btn-info btn-sm me-2">検索</button>
				</div>
			</form>

		</div>
	</div>

	<!-- 検索結果カード -->
	<div class="container mt-4">
		<div class="card mb-4">
			<div class="card-header">検索結果</div>
			<div class="card-body p-4">

				<!-- ラジオボタン選択で行を操作するための単一Form -->
				<form id="actionForm" th:method="post" th:action="@{/holiday/list}">

					<!-- 結果操作ボタンエリア -->
					<div class="d-flex justify-content-end mb-3">
						<button type="button" class="btn btn-success btn-sm me-2" data-bs-toggle="modal"
							data-bs-target="#sinki-modal">新規</button>
						<button type="button" id="koushin-btn" class="btn btn-primary btn-sm me-2"
							data-bs-toggle="modal" data-bs-target="#koushin-modal" disabled>更新</button>
						<button type="button" id="sakuzyo-btn" class="btn btn-danger btn-sm" data-bs-toggle="modal"
							data-bs-target="#sakuzyo-modal" disabled>削除</button>
					</div>

					<!--検索結果-->
					<table class="table mb-0">
						<!-- 見出しを黒 -->
						<thead class="table-dark">
							<tr>
								<th scope="col" style="width: 60px;" class="text-center">#</th>
								<th scope="col" style="width: 250px;">日付</th>
								<th scope="col">祝日名</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="holiday : ${holidayList}">
								<td class="text-center">
									<input type="radio" name="selectedHoliday" th:value="${holiday.id}"
										class="form-check-input" onclick="toggleActionButtons()" />
								</td>
								<td th:text="${holiday.holidayDate}"></td>
								<td th:text="${holiday.holidayName}"></td>
							</tr>
						</tbody>
					</table>


					<!-- ページ切り替え-->
					<div th:if="${totalPages > 1}" class="d-flex justify-content-center mt-4">
						<nav aria-label="Page navigation">
							<ul class="pagination m-0">

								<!-- 前へボタン -->
								<li class="page-item" th:classappend="${holidaySearchForm.page == 1} ? 'disabled'">
									<a class="page-link"
										th:href="@{/holiday/list(date=${holidaySearchForm.date}, holidayName=${holidaySearchForm.holidayName}, page=${holidaySearchForm.page - 1})}">
										前
									</a>
								</li>

								<!-- 真ん中のページ番号一覧 -->
								<li class="page-item" th:each="i : ${#numbers.sequence(1, totalPages)}"
									th:classappend="${i == holidaySearchForm.page} ? 'active'">
									<!-- 現在のページではない場合：リンクにする -->
									<a th:if="${i != holidaySearchForm.page}"
										th:href="@{/holiday/list(date=${holidaySearchForm.date}, holidayName=${holidaySearchForm.holidayName}, page=${i})}"
										class="page-link" th:text="${i}">1</a>
									<!-- 現在のページの場合：リンクにせずアクティブ表示にする -->
									<span th:if="${i == holidaySearchForm.page}" class="page-link text-white fw-bold"
										th:text="${i}">1</span>
								</li>

								<!-- 次へボタン -->
								<li class="page-item"
									th:classappend="${holidaySearchForm.page == totalPages} ? 'disabled'">
									<a class="page-link"
										th:href="@{/holiday/list(date=${holidaySearchForm.date}, holidayName=${holidaySearchForm.holidayName}, page=${holidaySearchForm.page + 1})}">
										次
									</a>
								</li>

							</ul>
						</nav>
					</div>
				</form>
			</div>
		</div>
	</div>


	<!-- 祝日新規モーダル -->
	<form th:action="@{/holiday/register}" th:object="${holiday}" method="post">
		<div class="modal fade" id="sinki-modal" tabindex="-1" aria-hidden="true">
			<div class="modal-dialog modal-xl">
				<div class="modal-content">
					<!-- モーダルヘッダー -->
					<div class="modal-header bg-info text-white">
						<h5 class="modal-title">祝日登録</h5>
						<button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
							aria-label="Close"></button>
					</div>

					<!-- モーダルボディ -->
					<div class="modal-body">
						<div class="card shadow-sm p-3 mb-4">
							<div class="card-header bg-light">
								<span class="fw-bold">祝日情報</span>
							</div>

							<div class="row g-4 align-items-center">
								<!-- 日付入力 -->
								<div class="col-md-3">
									<label class="form-label">日付：</label>
									<input type="date" th:field="*{holidayDate}" class="form-control"
										th:errorclass="is-invalid" />
									<div class="invalid-feedback" th:if="${#fields.hasErrors('holidayDate')}"
										th:errors="*{holidayDate}"></div>
								</div>
								<!-- 祝日名入力 -->
								<div class="col-md-4">
									<label class="form-label">祝日名：</label>
									<input type="text" th:field="*{holidayName}" class="form-control"
										th:errorclass="is-invalid" />
									<div class="invalid-feedback" th:if="${#fields.hasErrors('holidayName')}"
										th:errors="*{holidayName}"></div>
								</div>
							</div>
						</div>
					</div>

					<!-- モーダルフッター -->
					<div class="modal-footer">
						<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">キャンセル</button>
						<button type="submit" class="btn btn-success">登録</button>
					</div>
				</div>
			</div>
		</div>
	</form>


	<!-- 祝日更新モーダル -->
	<div class="modal fade" id="koushin-modal" tabindex="-1" aria-hidden="true">
		<div class="modal-dialog modal-xl">
			<form th:action="@{/holiday/update}" method="post" class="modal-content">
				<!-- モーダルヘッダー -->
				<div class="modal-header bg-info text-white">
					<h5 class="modal-title">祝日更新</h5>
					<button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
						aria-label="Close"></button>
				</div>

				<!-- モーダルボディ -->
				<div class="modal-body">
					<div class="card shadow-sm p-3 mb-4">
						<div class="card-header bg-light">
							<span class="fw-bold">祝日情報</span>
						</div>

						<div class="row g-4 align-items-center">
							<input type="hidden" id="editHolidayId" name="id" value="" />

							<!-- 日付入力 -->
							<div class="col-md-3">
								<label class="form-label">日付：</label>
								<input type="date" id="editHolidayDate" name="holidayDate" class="form-control" />
							</div>
							<!-- 祝日名入力 -->
							<div class="col-md-4">
								<label class="form-label">祝日名：</label>
								<input type="text" id="editHolidayName" name="holidayName" class="form-control" />
							</div>
						</div>
					</div>
				</div>

				<!-- モーダルフッター -->
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">キャンセル</button>
					<button type="submit" class="btn btn-primary">更新</button>
				</div>
			</form>
		</div>
	</div>




	<!-- 祝日削除モーダル -->
	<div class="modal fade" id="sakuzyo-modal" tabindex="-1" aria-hidden="true">
		<div class="modal-dialog modal-l">
			<form th:action="@{/holiday/delete}" method="post" class="modal-content">
				<!-- モーダルヘッダー -->
				<div class="modal-header bg-info text-white">
					<h5 class="modal-title">祝日削除</h5>
				</div>

				<!-- モーダルボディ -->
				<div class="modal-body">
					<input type="hidden" id="delete-holiday-id" name="id">

					<div class="card-header">
						<span>選択した祝日を削除しますか？
						</span>
					</div>

				</div>

				<!-- モーダルフッター -->
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">キャンセル</button>
					<button type="submit" class="btn btn-danger">削除</button>
				</div>
			</form>
		</div>
	</div>



	<script th:src="@{/js/holiday.js}"></script>
</body>

</html>
